[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drduc-translator"
version = "0.1.0"
description = "Non-LLM Rule-Based Machine Translation System (ZH/EN → VI)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "DrDuc"},
]
dependencies = [
    "pyyaml>=6.0",
    "chardet>=5.0",
    "jieba>=0.42",
    "watchdog>=4.0",
    "regex>=2024.0",
    "markdownify>=0.13",
    "python-docx>=1.0",
    "pdfplumber>=0.11",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
