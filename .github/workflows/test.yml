name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 19 * * 0"

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package
        run: python -m pip install -e ".[dev]"
      - name: Compile dictionary cache
        run: python -m src.core.md_dictionary_compiler --dict-root data/dictionaries
      - name: Run tests with coverage
        run: python -m pytest --cov=src --cov-report=term-missing --cov-report=xml
      - name: Run production regression gate
        run: python scripts/run_regression_gate.py --strict
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload regression report
        uses: actions/upload-artifact@v4
        with:
          name: regression-gate-report
          path: reports/regression_gate_report.json

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build desktop web shell
        working-directory: desktop
        run: npm run build

  tauri-native-build:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Tauri native package
        working-directory: desktop
        run: npm run tauri:build
